name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    # A credential committed by accident is not fixable by deleting it later:
    # once pushed, it must be rotated. Catching it here is the cheap path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans history, not just the tip

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy

      - name: Test
        # The suite mocks both APIs at the HTTP boundary, so it needs no network
        # and no credentials.
        run: pytest -q --cov=intune_cmdb_sync --cov-report=term-missing

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build -t intune-cmdb-sync:ci .

      - name: Build ECS image and check boto3 is present
        # STATE_PATH=s3://... imports boto3 at startup; without the extra, an ECS
        # task builds fine and then fails on its first run.
        run: |
          docker build --build-arg EXTRAS=aws -t intune-cmdb-sync:ecs-ci .
          docker run --rm --entrypoint python intune-cmdb-sync:ecs-ci -c "import boto3"

      - name: Build Lambda image
        run: docker build -f deploy/aws/Dockerfile.lambda -t intune-cmdb-sync:lambda-ci .

      - name: Smoke test the entrypoint
        # No configuration is supplied, so this must exit 2 (invalid config)
        # rather than crashing — which proves the package installed and the CLI
        # is wired up.
        run: |
          set +e
          docker run --rm -e LOG_FORMAT=text intune-cmdb-sync:ci --help
          docker run --rm -e LOG_FORMAT=text intune-cmdb-sync:ci
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit code 2 for missing configuration, got $code" >&2
            exit 1
          fi

  azure-function-package:
    # Builds the zip exactly as deploy/azure/deploy.sh does, then imports it on
    # Linux with the runtime's Python. A package that deploys but cannot import
    # registers no function, so nothing runs and nothing errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          mkdir -p build/package
          cp deploy/azure/functions/function_app.py deploy/azure/functions/host.json build/package/
          python -m pip wheel --quiet --no-deps --wheel-dir build/wheel .
          wheel=$(ls build/wheel/intune_cmdb_sync-*.whl)
          python -m pip install --quiet \
            --target build/package/.python_packages/lib/site-packages \
            --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 \
            --implementation cp --python-version 3.12 --only-binary=:all: \
            "${wheel}[azure]"

      - name: Import it and check the timer binding
        working-directory: build/package
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".python_packages/lib/site-packages")
          import cryptography.hazmat.bindings._rust  # compiled; proves the platform is right
          import function_app
          functions = function_app.app.get_functions()
          assert [f.get_function_name() for f in functions] == ["intune_cmdb_sync"], functions
          binding = functions[0].get_bindings()[0].get_dict_repr()
          assert binding["type"] == "timerTrigger", binding
          assert binding["schedule"] == "%SYNC_SCHEDULE%", binding
          assert binding["runOnStartup"] is False, binding
          print("ok", binding)
          EOF

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Bicep
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform
        working-directory: deploy/aws
        run: |
          terraform fmt -recursive -check -diff
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Check shell scripts
        # sh too: the script must parse far enough to re-run itself under bash.
        run: bash -n deploy/azure/deploy.sh && sh -n deploy/azure/deploy.sh
