[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intune-cmdb-sync"
version = "0.1.0"
description = "License-free daily sync of corporate-owned Intune devices into the ServiceNow CMDB via the Identification & Reconciliation Engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "intune-cmdb-sync contributors" }]
keywords = ["intune", "servicenow", "cmdb", "microsoft-graph", "itam", "ire"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "httpx>=0.27,<0.29",
  "azure-identity>=1.19,<2",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
intune-cmdb-sync = "intune_cmdb_sync.__main__:main"

[project.urls]
Homepage = "https://github.com/your-org/intune-cmdb-sync"
Issues = "https://github.com/your-org/intune-cmdb-sync/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/intune_cmdb_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:intune_cmdb_sync.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["intune_cmdb_sync"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
